<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ theme.bot_name }} · Tahap 5</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="--primary: {{ theme.color }};">
  <main class="chat-card">
    <header class="chat-header">
      <span class="avatar">{{ theme.avatar }}</span>
      <div><h1>{{ theme.bot_name }}</h1><p>{{ theme.name }}</p></div>
    </header>

    <div id="messages" class="messages" aria-live="polite"></div>

    <div class="suggestions">
      {% for s in theme.suggestions %}<button type="button" class="chip">{{ s }}</button>{% endfor %}
    </div>

    <form id="chat-form" class="chat-form" autocomplete="off">
      <input id="chat-input" placeholder="Ketik pesan..." maxlength="500" required>
      <button type="submit">Kirim</button>
    </form>
  </main>

  <script>
    // tojson mengubah nilai Python menjadi literal JavaScript yang aman
    const GREETING = {{ theme.greeting | tojson }};
    const AVATAR = {{ theme.avatar | tojson }};
  </script>
  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
