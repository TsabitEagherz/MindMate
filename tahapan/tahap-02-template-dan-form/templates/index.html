{% extends "base.html" %}

{% block content %}
<h1>Daftar tema (dari variabel Python)</h1>
<p>Jumlah tema: {{ tema | length }}</p>
<ul>
  {% for t in tema %}
  <li>{{ t.avatar }} <b>{{ t.nama }}</b> <small>(id: {{ t.id }})</small></li>
  {% endfor %}
</ul>
<p><a href="{{ url_for('beo') }}">Coba bot beo &rarr;</a></p>
{% endblock %}
